<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore Bible stories for little explorers.">
    <title>Bible Stories | Little Explorers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="top">
        <div class="header-tools">
            <a class="logo" href="index.html" aria-label="Little Explorers home">
                <img src="../resources/images/logo.png" alt="Little Explorers">
            </a>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a href="stories.html" aria-current="page">Stories</a>
            <a href="index.html#explore">Explore</a>
            <a href="index.html#about">About</a>
        </nav>
        <label class="search">
            <span class="visually-hidden">Search Little Explorers</span>
            <input type="search" placeholder="Search..." aria-label="Search Little Explorers">
        </label>
    </header>

    <main class="story-library">
        <section class="library-intro">
            <p class="eyebrow">A little wonder in every story</p>
            <h1>Choose a Bible story</h1>
            <p>Pick a story to read together. New adventures can be added to this library anytime.</p>
        </section>
        <section class="library-content" aria-labelledby="library-heading">
            <h2 id="library-heading" class="visually-hidden">Available Bible stories</h2>
            <div class="library-grid" id="story-library" aria-live="polite">
                <p class="story-loading">Loading stories...</p>
            </div>
        </section>
    </main>

    <footer class="help-bar">
        <p>Need a hand exploring? Ask a grown-up to explore the stories with you.</p>
    </footer>

    <script src="stories-data.js"></script>
    <script src="stories.js"></script>
</body>

</html>
