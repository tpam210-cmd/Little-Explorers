<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read a Bible story with Little Explorers.">
    <title>Storybook | Little Explorers</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="top">
        <div class="header-tools">
            <a class="logo" href="index.html" aria-label="Little Explorers home">
                <img src="../resources/images/logo.png" alt="Little Explorers">
            </a>
        </div>
        <nav aria-label="Main navigation">
            <a href="index.html#home">Home</a>
            <a href="stories.html" aria-current="page">Stories</a>
            <a href="index.html#explore">Explore</a>
            <a href="index.html#about">About</a>
        </nav>
        <label class="search">
            <span class="visually-hidden">Search Little Explorers</span>
            <input type="search" placeholder="Search..." aria-label="Search Little Explorers">
        </label>
    </header>

    <main class="reader-page" id="reader-container">
        <div class="reader-toolbar">
            <a class="back-to-library" href="stories.html">← Back to all stories</a>
            <button id="fullscreen-toggle" class="fullscreen-button" type="button" aria-pressed="false">
                <span aria-hidden="true">⛶</span> Full screen
            </button>
        </div>
        <h1 id="story-title" class="reader-title">Loading story...</h1>
        <section class="storybook" id="storybook-frame" aria-label="Story pages">
            <div class="book-frame">
                <div class="book-spread">
                    <figure class="storybook-illustration">
                        <img id="story-image" src="" alt="">
                    </figure>
                    <div class="book-copy-page">
                        <span class="book-page-label">A Little Explorers story</span>
                        <p id="story-text" class="storybook-text" aria-live="polite"></p>
                    </div>
                    <div id="page-flip" class="book-page-turn" aria-hidden="true" hidden>
                        <div class="page-turn-leaf">
                        </div>
                    </div>
                    <div class="book-spine" aria-hidden="true"></div>
                </div>
            </div>
        </section>
        <div class="storybook-controls" aria-label="Story pages">
            <button id="previous-page" class="page-button" type="button">← Previous</button>
            <p id="page-indicator" class="page-indicator" aria-live="polite"></p>
            <button id="next-page" class="page-button" type="button">Next →</button>
        </div>
        <p id="fullscreen-status" class="fullscreen-status" role="status" hidden></p>
        <p id="story-error" class="story-error" role="alert" hidden></p>
    </main>

    <footer class="help-bar">
        <p>Need a hand exploring? Ask a grown-up to explore the stories with you.</p>
    </footer>

    <script src="stories-data.js"></script>
    <script src="storybook.js"></script>
</body>

</html>
